<main class="wrap" id="top">
  <div class="layout">
    <div class="main">
      <div class="head">
        <h1 id="ttl"></h1>
        <div class="tags" id="tg"></div>
      </div>

      <div class="gal" id="gal"></div>
      <div class="al" id="al" hidden></div>

      <div class="stats" id="st" aria-label="Account details"></div>

      <section id="dsw" hidden>
        <h2>About this account</h2>
        <p id="ds" class="ds"></p>
      </section>

      <section id="tpw" hidden>
        <h2>Topics &amp; features</h2>
        <div class="chips" id="tp"></div>
      </section>

      <section>
        <h2>About the seller</h2>
        <div class="sbx">
          <i aria-hidden="true" id="si"></i>
          <div><b id="sn"></b><small id="ss"></small><span>Have a question about this account? Ask the seller here. Chat stays inside socialmarket.</span></div>
          <button type="button" class="btn" id="cs2">&#9993; Contact seller</button>
        </div>
        <div class="rvs" id="rv" hidden></div>
      </section>

      <section id="pw" hidden>
        <h2>Popular right now</h2>
        <div class="pgr" id="pg"></div>
      </section>
    </div>

    <aside class="buy" aria-label="Price">
      <div class="price"><span id="pr"></span></div>
      <button type="button" class="btn full" id="buy">Buy now</button>
      <button type="button" class="btn line full" id="cs" style="margin-top:10px">&#9993; Contact seller</button>
      <div class="seller"><i id="si2"></i><div><b id="sn2"></b></div></div>
    </aside>
  </div>

  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Full size picture">
    <button type="button" class="lx" id="lbx" aria-label="Close">&times;</button>
    <button type="button" class="ln lp" id="lbp" aria-label="Previous picture">&lsaquo;</button>
    <img id="lbi" alt="">
    <button type="button" class="ln lq" id="lbn" aria-label="Next picture">&rsaquo;</button>
    <span class="lc" id="lbc"></span>
  </div>
</main>
