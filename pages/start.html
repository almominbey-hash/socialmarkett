<main id="top">
  

  <section class="wrap" id="browse">
    <form class="fq" id="fq" role="search" hidden><input id="fi" type="search" aria-label="Search"><button type="submit" aria-label="Search">&uarr;</button></form>
    <div class="exh">
      <div class="exl"><h2 id="exh">An audience worth building on.</h2><p id="exs" hidden>Featured accounts, ready for their next chapter.</p></div>
      <div class="exr">
        <button type="button" class="sa" id="sa">Explore all accounts <span aria-hidden="true">&#8599;</span></button>
        <button type="button" class="ar" id="pv" aria-label="Previous">&lsaquo;</button>
        <button type="button" class="ar" id="nx" aria-label="Next">&rsaquo;</button>
      </div>
    </div>
    <select id="sort" aria-label="Sort by" hidden><option value="rec">Recommended</option></select>
    <div class="xp">
      
      <div class="xr"><div class="fbar"><button type="button" class="fbt" id="fbtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Filters</span><i id="fcn" hidden></i></button><div class="subs" id="subs" aria-label="Sub categories"></div></div>
      <div class="xrail" id="grid"></div>
      </div>
    </div>
  </section>

  <section class="wrap rec" id="rec" hidden>
    <h2 id="rech">Inspired by your recent activity</h2>
    <div class="recr" id="recg"></div>
  </section>
  <div class="fmod" id="fmod" hidden><div class="fbox fl" role="dialog" aria-modal="true" aria-label="Filters">
    <div class="fh"><h3>Filters</h3><button type="button" class="fx" id="fcl" aria-label="Close">&times;</button></div>
        <label for="fk">Search</label><input id="fk" type="search" placeholder="Niche, name or keyword" autocomplete="off">
        <label for="fp">Platform</label><select id="fp"></select>
        <label for="fpmin">Price (Rs.)</label>
        <div class="pr"><input type="number" id="fpmin" min="0" inputmode="numeric" placeholder="Min" aria-label="Minimum price"><span aria-hidden="true">&ndash;</span><input type="number" id="fpmax" min="0" inputmode="numeric" placeholder="Max" aria-label="Maximum price"></div>
        <label for="fs">Followers</label><select id="fs"></select>
        <label for="fa" id="fal">Country</label><select id="fa"></select>
        <label for="fm">Monetization</label><select id="fm"></select>
        <label for="fg">Account age</label><select id="fg"></select>
        <label for="fn">Niche</label><select id="fn"></select>
        <label for="fso">Sort by</label><select id="fso"></select>
        <button type="button" class="btn" id="fap">Apply filters</button>
        <button type="button" class="rst" id="frs">Reset all filters</button>
      </div></div>
</main>
