<main id="top">
  <section class="wrap hero" id="hero">
    <h1 id="wb">Buy and sell social media accounts safely</h1>
    <form class="search" role="search" id="sf">
      <input id="q" type="search" placeholder="Search by niche, e.g. fitness, gaming, travel" aria-label="Search accounts">
      <button class="btn" type="submit">Search</button>
    </form>
    <form class="fq" id="fq" role="search" hidden><input id="fi" type="search" placeholder="What kind of account are you looking for? e.g. a gaming channel" aria-label="What kind of account are you looking for?"><button type="submit" aria-label="Search">&uarr;</button></form>
  </section>

  <section class="wrap" id="browse">
    <div class="exh">
      <h2 id="exh">Explore popular categories on socialmarket</h2>
      <div class="exr">
        <button type="button" class="sa" id="sa">Show all</button>
        <button type="button" class="ar" id="pv" aria-label="Previous">&lsaquo;</button>
        <button type="button" class="ar" id="nx" aria-label="Next">&rsaquo;</button>
      </div>
    </div>
    <select id="sort" aria-label="Sort by" hidden><option value="rec">Recommended</option></select>
    <div class="xp">
      <aside class="fl" id="fl" aria-label="Refine your search">
        <h3>Refine your search</h3>
        <label for="fp">Platform</label><select id="fp"></select>
        <label for="fn">Niche</label><select id="fn"></select>
        <label for="fa" id="fal" hidden>Audience language</label><select id="fa" hidden></select>
        <label for="fpr">Price</label><select id="fpr"></select>
        <label for="fs">Subscribers</label><select id="fs"></select>
        <button type="button" class="btn" id="fap">Apply filters</button>
        <button type="button" class="rst" id="frs">Reset all filters</button>
      </aside>
      <div class="xr"><div class="subs" id="subs" aria-label="Sub categories"></div>
      <div class="xrail" id="grid"></div></div>
    </div>
  </section>

  <section class="wrap rec" id="rec" hidden>
    <h2>Inspired by your recent activity</h2>
    <div class="recr" id="recg"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 socialmarket</span>
  </div>
</footer>
