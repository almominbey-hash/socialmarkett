<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – socialmarket</title>
<style>
:root{--bg:#fff;--text:#14181f;--muted:#566070;--line:#e3e7ee;--accent:#1d5fd6;--accent-t:#fff;--soft:#f5f7fa;--ok:#14803c;--bad:#c0262d;--warn:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#10141b;--text:#eef1f6;--muted:#a3adbd;--line:#283142;--accent:#6b9bff;--accent-t:#0b1020;--soft:#181e28;--ok:#4cc27a;--bad:#ff7b80;--warn:#e3b341}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0 0 4px}
.m{color:var(--muted);font-size:14px}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-t);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.line{background:transparent;color:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.tabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tab,.chip{font:inherit;border:1px solid var(--line);background:var(--soft);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-pressed=true],.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;text-align:center}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px;background:var(--bg)}
.row{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:10px 0;font-size:15px}
.row b{color:var(--muted);font-weight:500}
.row span{word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--soft)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.warn{color:var(--warn);border-color:var(--warn)}
.imgs,.shots{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.imgs a img{width:240px;max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.shots a img{width:150px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.box{max-width:380px;margin:60px auto;border:1px solid var(--line);border-radius:12px;padding:24px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.hide{display:none}
@media (max-width:560px){.row{grid-template-columns:1fr}.row b{margin-top:6px}}
</style>
</head>
<body>
<div class="wrap">

<div id="vLogin" class="box hide">
  <h1>Admin login</h1>
  <p class="m">Use the same email and password as your socialmarket account.</p>
  <form id="fLogin">
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="eLogin" role="alert"></div>
    <button class="btn" style="width:100%;margin-top:8px" id="bLogin">Log in</button>
  </form>
</div>

<div id="vDenied" class="box hide">
  <h1>No admin access</h1>
  <p class="m" id="denMsg">This account is not an admin.</p>
  <button class="btn line" id="bOut1">Log out</button>
</div>

<div id="vPanel" class="hide">
  <header>
    <div><h1>socialmarket admin</h1><div class="m" id="who"></div></div>
    <div style="display:flex;gap:8px"><a class="btn line" href="./" style="text-decoration:none">Open site</a><button class="btn line" id="bOut2">Log out</button></div>
  </header>
  <div class="tabs" id="tabs">
    <button class="tab" data-t="kyc" aria-pressed="true">Seller IDs <span class="badge hide" id="cK">0</span></button>
    <button class="tab" data-t="lst" aria-pressed="false">Listings <span class="badge hide" id="cL">0</span></button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/00-supabase.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function show(id){["vLogin","vDenied","vPanel"].forEach(function(v){$(v).classList.toggle("hide",v!==id)})}
function msg(e){return (e&&e.message)?e.message:"Something went wrong. Please try again."}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:null}
function money(n){return "$"+Number(n).toLocaleString("en-US")}
function when(d){try{return new Date(d).toLocaleString()}catch(e){return d}}

var tab="kyc",status="pending";
var STAT={kyc:[["pending","Waiting"],["verified","Approved"],["rejected","Rejected"]],
          lst:[["pending","In review"],["live","Live"],["rejected","Rejected"],["sold","Sold"]]};

/* ---- start: check who is logged in ---- */
function start(){
  sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(!s){show("vLogin");return}
    return sb.rpc("is_admin").then(function(a){
      if(a.error||a.data!==true){
        $("denMsg").textContent=a.error?("Admin setup is not finished yet: "+msg(a.error)):("You are logged in as "+(s.user.email||"")+", but this account is not an admin.");
        show("vDenied");return}
      $("who").textContent=s.user.email||"";
      show("vPanel");drawChips();load();counts();
    });
  });
}

$("fLogin").onsubmit=function(e){
  e.preventDefault();$("eLogin").textContent="";$("bLogin").disabled=true;
  sb.auth.signInWithPassword({email:$("em").value.trim().toLowerCase(),password:$("pw").value}).then(function(r){
    $("bLogin").disabled=false;
    if(r.error){$("eLogin").textContent=msg(r.error);return}
    $("pw").value="";start();
  });
};
function out(){sb.auth.signOut().then(function(){show("vLogin")})}
$("bOut1").onclick=out;$("bOut2").onclick=out;

/* ---- tabs and filters ---- */
$("tabs").onclick=function(e){
  var b=e.target.closest(".tab");if(!b)return;
  tab=b.dataset.t;status="pending";
  [].forEach.call(document.querySelectorAll(".tab"),function(x){x.setAttribute("aria-pressed",x===b)});
  drawChips();load();
};
function drawChips(){
  $("chips").innerHTML=STAT[tab].map(function(s){return '<button class="chip" data-s="'+s[0]+'" aria-pressed="'+(s[0]===status)+'">'+s[1]+'</button>'}).join("");
}
$("chips").onclick=function(e){
  var b=e.target.closest(".chip");if(!b)return;
  status=b.dataset.s;drawChips();load();
};

function counts(){
  sb.rpc("admin_verifications",{p_status:"pending"}).then(function(r){var n=(r.data||[]).length;$("cK").textContent=n;$("cK").classList.toggle("hide",!n)});
  sb.rpc("admin_listings",{p_status:"pending"}).then(function(r){var n=(r.data||[]).length;$("cL").textContent=n;$("cL").classList.toggle("hide",!n)});
}

/* ---- load the list ---- */
function load(){
  var box=$("list");box.innerHTML='<p class="m">Loading...</p>';
  var call=tab==="kyc"?sb.rpc("admin_verifications",{p_status:status}):sb.rpc("admin_listings",{p_status:status});
  call.then(function(r){
    if(r.error){box.innerHTML='<div class="empty">'+esc(msg(r.error))+'</div>';return}
    var L=r.data||[];
    if(!L.length){box.innerHTML='<div class="empty">Nothing here.</div>';return}
    box.innerHTML=L.map(tab==="kyc"?kycCard:lstCard).join("");
  });
}

function row(a,b){return '<div class="row"><b>'+esc(a)+'</b><span>'+b+'</span></div>'}

function kycCard(v){
  return '<div class="card" data-u="'+esc(v.user_id)+'" data-f="'+esc(v.front_path)+'" data-b="'+esc(v.back_path)+'">'+
    '<h2>'+esc(v.full_name)+'</h2><div class="m">Sent '+esc(when(v.submitted_at))+'</div>'+
    row("Email",esc(v.email))+row("Phone",esc(v.phone))+row("ID type",esc(v.id_type))+row("ID number",esc(v.id_number))+row("Payout details",esc(v.payout))+
    '<button class="btn line" data-a="photos">Show ID photos</button><div class="imgs"></div>'+
    '<div class="acts">'+
      (v.kyc_status!=="verified"?'<button class="btn ok" data-a="kyc-verified">Approve seller</button>':'')+
      (v.kyc_status!=="rejected"?'<button class="btn bad" data-a="kyc-rejected">Reject</button>':'')+
    '</div></div>';
}

function lstCard(l){
  var link=safeUrl(l.account_link),kyc=l.seller_kyc;
  var kp='<span class="pill '+(kyc==="verified"?"ok":(kyc==="rejected"?"bad":"warn"))+'">Seller ID: '+esc(kyc==="verified"?"approved":kyc)+'</span>';
  var shots=(l.shots||[]).map(function(u){var s=safeUrl(u);return s?'<a href="'+esc(s)+'" target="_blank" rel="noopener"><img loading="lazy" alt="Screenshot" src="'+esc(s)+'"></a>':''}).join("");
  var acts='';
  if(l.status!=="live")acts+='<button class="btn ok" data-a="lst-live">Make live</button>';
  if(l.status!=="rejected")acts+='<button class="btn bad" data-a="lst-rejected">Reject</button>';
  if(l.status==="live")acts+='<button class="btn line" data-a="lst-sold">Mark sold</button>';
  if(l.status==="live")acts+='<button class="btn line" data-a="lst-pending">Back to review</button>';
  return '<div class="card" data-id="'+esc(l.id)+'">'+
    '<h2>'+esc(l.platform)+' · '+esc(l.title)+'</h2><div class="m">Added '+esc(when(l.created_at))+'</div>'+
    row("Seller",esc(l.seller_name)+' ('+esc(l.seller_email)+') '+kp)+
    row("Niche",esc(l.niche))+row("Followers",Number(l.followers).toLocaleString("en-US"))+
    row("Monthly income",money(l.income))+row("Price",money(l.price))+
    row("Account link (private)",link?'<a href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">'+esc(link)+'</a>':esc(l.account_link))+
    row("Description",esc(l.description))+
    (shots?'<div class="shots">'+shots+'</div>':'')+
    '<div class="acts">'+acts+'</div></div>';
}

/* ---- buttons inside cards ---- */
$("list").onclick=function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;
  var card=b.closest(".card"),a=b.dataset.a;
  if(a==="photos"){photos(card,b);return}
  var parts=a.split("-"),kind=parts[0],to=parts[1];
  var word={verified:"approve this seller",rejected:"reject this",live:"make this listing live",sold:"mark this as sold",pending:"send this back to review"}[to];
  if(!confirm("Are you sure you want to "+word+"?"))return;
  b.disabled=true;
  var call=kind==="kyc"?sb.rpc("admin_set_kyc",{p_user:card.dataset.u,p_status:to}):sb.rpc("admin_set_listing",{p_id:card.dataset.id,p_status:to});
  call.then(function(r){
    if(r.error){b.disabled=false;alert(msg(r.error));return}
    card.remove();counts();
    if(!$("list").querySelector(".card"))$("list").innerHTML='<div class="empty">Nothing here.</div>';
  });
};

function photos(card,btn){
  var box=card.querySelector(".imgs");btn.disabled=true;btn.textContent="Loading...";
  Promise.all([card.dataset.f,card.dataset.b].map(function(p){return sb.storage.from("kyc").createSignedUrl(p,600)})).then(function(rs){
    var html="",bad=null;
    rs.forEach(function(r,i){
      if(r.error||!r.data){bad=r.error;return}
      html+='<div><div class="m">'+(i?"Back":"Front")+'</div><a href="'+esc(r.data.signedUrl)+'" target="_blank" rel="noopener"><img alt="ID '+(i?"back":"front")+'" src="'+esc(r.data.signedUrl)+'"></a></div>';
    });
    box.innerHTML=html||('<span class="m">'+esc(msg(bad))+'</span>');
    btn.textContent="Photos shown (links expire in 10 minutes)";
  });
}

start();
})();
</script>
</body>
</html>
