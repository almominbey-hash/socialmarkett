<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin – socialmarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--text:#14181f;--muted:#566070;--line:#e3e7ee;--accent:#1d5fd6;--accent-t:#fff;--soft:#f5f7fa;--ok:#1dbf73;--bad:#e0577f;--warn:#d98a00;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10141b;--text:#eef1f6;--muted:#a3adbd;--line:#283142;--accent:#6b9bff;--accent-t:#0b1020;--soft:#181e28;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--text);font:15px/1.5 Inter,sans-serif}
h1,h2,h3,b,strong,th{font-weight:600}
h1{font-size:28px;letter-spacing:-.02em;margin:0}h2{font-size:18px;margin:0 0 14px}
a{color:var(--accent);text-decoration:none}
button,input,select{font-family:inherit;font-size:15px}
[hidden]{display:none!important}
#bar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.in{max-width:1400px;margin:0 auto;padding:0 24px}
.top{height:68px;display:flex;align-items:center;gap:16px}
.logo{font-weight:500;font-size:26px;letter-spacing:-.05em;color:var(--text)}.logo b{color:var(--ok);font-weight:700}
.tag{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.sp{flex:1}
.who{color:var(--muted);font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{position:relative;padding:12px 14px;color:var(--text);font-weight:500;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.tabs a::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--accent);opacity:0}
nav.tabs a:hover::after,nav.tabs a.on::after{opacity:1}
nav.tabs a.on{color:var(--accent)}
.badge{background:var(--bad);color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;padding:0 5px}
main{max-width:1400px;margin:0 auto;padding:28px 24px 60px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.m{color:var(--muted);margin:4px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--text);background:var(--text);color:var(--bg);border-radius:10px;padding:9px 16px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.85}
.btn.line{background:none;color:var(--text);border-color:var(--line)}.btn.line:hover{border-color:var(--accent);opacity:1}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:none;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:wait}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.c{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--bg)}
.c .k{color:var(--muted);font-size:13px;font-weight:500}.c .v{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:2px}.c .s{font-size:13px;color:var(--muted)}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px}
.al{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px 18px;background:var(--soft);color:var(--text);cursor:pointer}
.al:hover{border-color:var(--accent)}.al b{font-size:22px}.al.hot b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:22px}
.bar-row{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar-row i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tools input,.tools select,.fld input{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 14px;outline:none;min-width:200px}
.tools input:focus,.fld input:focus{border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.chip{border:1px solid var(--line);background:none;color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tb{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--soft);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok);background:none}.pill.bad{color:var(--bad);border-color:var(--bad);background:none}.pill.warn{color:var(--warn);border-color:var(--warn);background:none}
.mut{color:var(--muted);font-size:13px}.empty{padding:40px;text-align:center;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
#md{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
#md.on{display:flex}
#mb{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:100%;max-width:720px;padding:26px;position:relative}
#mx{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--text);font-size:20px;cursor:pointer}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:14px 0;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:14px 0}
.imgs a{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}.imgs img{display:block;width:100%;height:140px;object-fit:cover}.imgs span{display:block;padding:6px 10px;font-size:12px;color:var(--muted)}
.tl{border-left:2px solid var(--line);margin:12px 0 12px 6px;padding-left:16px;font-size:14px}.tl div{margin:8px 0}
.note{border:1px solid var(--bad);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:200;font-weight:500;max-width:90vw}
#toast.bad{background:var(--bad);color:#fff}
#gate{max-width:420px;margin:12vh auto;padding:0 20px}
#gate .c{padding:28px}.fld{display:block;margin:14px 0}.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.fld input{width:100%}
@media (max-width:640px){h1{font-size:23px}.top{height:60px}.who{display:none}.in,main{padding-left:16px;padding-right:16px}.kv{grid-template-columns:1fr}}
</style></head>
<body>

<section id="gate" hidden>
  <div class="c">
    <a class="logo" href="/">socialmarket<b>.</b></a> <span class="tag">Admin</span>
    <h2 style="margin-top:18px">Sign in</h2>
    <p class="m" id="gmsg">Use your admin account.</p>
    <label class="fld"><span>Email</span><input id="ge" type="email" autocomplete="username"></label>
    <label class="fld"><span>Password</span><input id="gp" type="password" autocomplete="current-password"></label>
    <button class="btn" id="gb" style="width:100%;justify-content:center">Sign in</button>
    <p style="text-align:right;margin:10px 0 0"><a href="#" id="gf">Forgot password?</a></p>
    <p class="mut" style="text-align:center;margin:14px 0">or</p>
    <button class="btn line" id="gg" style="width:100%;justify-content:center">Continue with Google</button>
    <div id="gnew" hidden>
      <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
      <b>Set a new password</b>
      <label class="fld"><span>New password (8+ characters)</span><input id="gn" type="password" autocomplete="new-password"></label>
      <button class="btn" id="gnb" style="width:100%;justify-content:center">Save new password</button>
    </div>
  </div>
</section>

<div id="app" hidden>
  <div id="bar">
    <div class="in top">
      <a class="logo" href="/">socialmarket<b>.</b></a><span class="tag">Admin</span>
      <span class="sp"></span><span class="who" id="who"></span>
      <a class="btn line sm" href="/">View site &#8599;</a>
      <button class="btn line sm" id="out">Log out</button>
    </div>
    <div class="in"><nav class="tabs" id="tabs">
      <a href="#overview" data-t="overview">Overview</a>
      <a href="#sellers" data-t="sellers">Seller verification <span class="badge" id="b-kyc" hidden></span></a>
      <a href="#listings" data-t="listings">Listings <span class="badge" id="b-lst" hidden></span></a>
      <a href="#orders" data-t="orders">Orders &amp; payouts <span class="badge" id="b-ord" hidden></span></a>
      <a href="#users" data-t="users">Users</a>
      <a href="#searches" data-t="searches">Searches</a>
    </nav></div>
  </div>
  <main id="view"></main>
</div>

<div id="md"><div id="mb"><button id="mx" aria-label="Close">&times;</button><div id="mc"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Same project as the website (this is the public anon key; real protection is is_admin() inside the database) */
var SUPABASE_URL="https://jghgpncepmcmppefybvn.supabase.co";
var SUPABASE_ANON_KEY="sb_publishable__bdTHwvUBt7QE5wuCimz-w_MYJqTtR8";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{flowType:"pkce",persistSession:true,autoRefreshToken:true}});

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const dt=s=>s?new Date(s).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"–";
const ds=s=>s?new Date(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"–";
const num=n=>Number(n||0).toLocaleString("en-US");
const short=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,"")+"M":n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,"")+"K":String(n)};
const LB={awaiting_payment:"Awaiting payment",in_progress:"In progress",delivered:"Delivered",completed:"Completed",cancelled:"Cancelled",pending:"In review",live:"Live",sold:"Sold",rejected:"Rejected",verified:"Verified",none:"Not applied"};
const TONE={completed:"ok",live:"ok",verified:"ok",paid:"ok",released:"ok",cancelled:"bad",rejected:"bad",refunded:"bad",pending:"warn",in_progress:"warn",delivered:"warn",held:"warn",awaiting_payment:""};
const pill=s=>'<span class="pill '+(TONE[s]||"")+'">'+esc(LB[s]||s||"–")+"</span>";
let tm;function toast(t,bad){const e=$("#toast")||document.body.appendChild(Object.assign(document.createElement("div"),{id:"toast"}));e.textContent=t;e.className=bad?"bad":"";e.hidden=false;clearTimeout(tm);tm=setTimeout(()=>e.hidden=true,3500)}
async function rpc(n,a){const r=await sb.rpc(n,a||{});if(r.error)throw r.error;return r.data}
const fail=e=>toast((e&&e.message)||"Something went wrong",true);

/* ---------- sign in ---------- */
let ME=null,ST=null;
async function start(){
  const {data}=await sb.auth.getSession();
  if(!data.session)return gate();
  let ok=false,er="";try{ok=await rpc("is_admin")}catch(e){er=e.message||String(e)}
  if(!ok){const em=data.session.user.email;await sb.auth.signOut();return gate(er?"Signed in as "+em+", but the database says: "+er+" (Run supabase/admin.sql in Supabase SQL Editor first.)":"Signed in as "+em+", but this account is not an admin yet. In Supabase run: update public.profiles set is_admin = true where email = '"+em+"';")}
  ME=data.session.user;$("#gate").hidden=true;$("#app").hidden=false;$("#who").textContent=ME.email;
  refreshBadges();route();
}
function gate(msg){$("#app").hidden=true;$("#gate").hidden=false;if(msg)$("#gmsg").textContent=msg}
$("#gb").onclick=async()=>{
  const b=$("#gb");b.disabled=true;
  const r=await sb.auth.signInWithPassword({email:$("#ge").value.trim(),password:$("#gp").value});
  b.disabled=false;if(r.error)return $("#gmsg").textContent=/invalid login/i.test(r.error.message)?"Wrong email or password. If you created this account with Google, use Continue with Google, or press Forgot password to set one.":r.error.message;start();
};
$("#gg").onclick=()=>sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+"/admin"}});
$("#gf").onclick=async e=>{e.preventDefault();const em=$("#ge").value.trim();if(!em)return $("#gmsg").textContent="Type your email above first, then press Forgot password.";
  const r=await sb.auth.resetPasswordForEmail(em.toLowerCase(),{redirectTo:location.origin+"/admin"});
  $("#gmsg").textContent=r.error?r.error.message:"We sent a reset link to "+em+". Open it and you will come back here to set a new password."};
sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY"){$("#app").hidden=true;$("#gate").hidden=false;$("#gnew").hidden=false;$("#gmsg").textContent="Choose your new password."}});
$("#gnb").onclick=async()=>{const p=$("#gn").value;if(p.length<8)return $("#gmsg").textContent="Password must be 8 or more characters.";
  const r=await sb.auth.updateUser({password:p});if(r.error)return $("#gmsg").textContent=r.error.message;
  $("#gnew").hidden=true;$("#gmsg").textContent="Password changed.";start()};
$("#gp").onkeydown=e=>{if(e.key==="Enter")$("#gb").click()};
$("#out").onclick=async()=>{await sb.auth.signOut();location.reload()};

/* ---------- small UI helpers ---------- */
function table(cols,rows,empty){
  if(!rows.length)return '<div class="tb"><div class="empty">'+(empty||"Nothing here yet.")+"</div></div>";
  return '<div class="tb"><table><thead><tr>'+cols.map(c=>"<th>"+c[0]+"</th>").join("")+"</tr></thead><tbody>"+
    rows.map(r=>"<tr>"+cols.map(c=>"<td>"+c[1](r)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";
}
function bars(d,fmt){ /* 30 day bar chart in SVG */
  const mx=Math.max(1,...d.map(x=>+x.n)),w=600,h=150,bw=w/d.length;
  return '<svg viewBox="0 0 '+w+" "+(h+22)+'" width="100%" role="img">'+d.map((x,i)=>{
    const bh=Math.max(+x.n?3:0,(+x.n/mx)*h);
    return '<rect x="'+(i*bw+2)+'" y="'+(h-bh)+'" width="'+(bw-4)+'" height="'+bh+'" rx="3" fill="var(--accent)" opacity="'+(+x.n?1:.25)+'"><title>'+ds(x.d)+": "+fmt(x.n)+"</title></rect>"}).join("")+
    '<text x="0" y="'+(h+16)+'" font-size="11" fill="var(--muted)">'+ds(d[0].d)+'</text><text x="'+w+'" y="'+(h+16)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+ds(d[d.length-1].d)+"</text></svg>";
}
function hbars(o,order){
  const k=(order||Object.keys(o)),mx=Math.max(1,...k.map(x=>o[x]||0));
  return k.map(x=>'<div class="bar-row"><span>'+esc(LB[x]||x)+'</span><span><i style="width:'+((o[x]||0)/mx*100)+'%"></i></span><b>'+num(o[x])+"</b></div>").join("")||'<p class="mut">No data yet.</p>';
}
function modal(h){$("#mc").innerHTML=h;$("#md").classList.add("on")}
function closeM(){$("#md").classList.remove("on")}
$("#mx").onclick=closeM;$("#md").onclick=e=>{if(e.target.id==="md")closeM()};document.onkeydown=e=>{if(e.key==="Escape")closeM()};
const kv=a=>'<dl class="kv">'+a.filter(x=>x[1]!==undefined&&x[1]!==null&&x[1]!=="").map(x=>"<dt>"+x[0]+"</dt><dd>"+x[1]+"</dd>").join("")+"</dl>";
async function refreshBadges(){
  try{ST=await rpc("admin_stats")}catch(e){return fail(e)}
  const set=(id,n)=>{const e=$(id);e.hidden=!n;e.textContent=n};
  set("#b-kyc",ST.kyc_pending);set("#b-lst",(ST.listings||{}).pending||0);set("#b-ord",(+ST.ready||0)+(+ST.attention||0));
}

/* ---------- pages ---------- */
const V={};let FILT={};
function route(){
  const t=(location.hash||"#overview").slice(1);const k=V[t]?t:"overview";
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t===k));
  $("#view").innerHTML='<p class="mut">Loading…</p>';
  V[k]().catch(fail);window.scrollTo(0,0);
}
window.onhashchange=route;

V.overview=async()=>{
  await refreshBadges();const s=ST,L=s.listings||{},O=s.orders||{};
  const al=(n,t,h,hot)=>'<a class="al'+(hot&&n?" hot":"")+'" href="#'+h+'"><span>'+t+"</span><b>"+num(n)+"</b></a>";
  const card=(k,v,sub)=>'<div class="c"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+(sub||"&nbsp;")+"</div></div>";
  $("#view").innerHTML='<div class="hd"><div><h1>Overview</h1><p class="m">Everything happening on socialmarket right now.</p></div><button class="btn line" onclick="route()">Refresh</button></div>'+
  '<div class="alerts">'+al(s.kyc_pending,"Sellers waiting for approval","sellers",1)+al(L.pending||0,"Listings waiting for review","listings",1)+al(s.ready,"Payouts ready to release","orders",1)+al(s.attention,"Orders needing attention","orders",1)+"</div>"+
  '<div class="cards">'+card("Total users",num(s.users),"+"+num(s.new_users_7d)+" in 7 days")+card("Verified sellers",num(s.sellers))+card("Live listings",num(L.live||0),num(L.sold||0)+" sold")+
  card("Sales (paid)",money(s.gmv))+card("Your fees",money(s.fees))+card("Held for sellers",money(s.held))+card("Chats",num(s.conversations),num(s.messages_24h)+" messages today")+card("Listing views",num(s.views))+"</div>"+
  '<div class="grid2"><div class="c"><h2>New users, last 30 days</h2>'+bars(s.signups,num)+'</div><div class="c"><h2>Sales, last 30 days</h2>'+bars(s.sales,money)+"</div></div>"+
  '<div class="grid2"><div class="c"><h2>Orders by status</h2>'+hbars(O,["awaiting_payment","in_progress","delivered","completed","cancelled"])+'</div><div class="c"><h2>Live accounts by platform</h2>'+hbars(s.platforms)+"</div></div>";
};

V.sellers=async()=>{
  const f=FILT.kyc||"pending";
  const rows=await rpc("admin_users",{p_kyc:f==="all"?"any":f});
  $("#view").innerHTML='<div class="hd"><div><h1>Seller verification</h1><p class="m">Check the ID and details, then approve or reject.</p></div></div>'+
  '<div class="tools">'+["pending","verified","rejected","all"].map(x=>'<button class="chip'+(f===x?" on":"")+'" data-a="kycf" data-id="'+x+'">'+(x==="all"?"All":LB[x])+"</button>").join("")+"</div>"+
  table([["Name",r=>"<b>"+esc(r.full_name||"–")+'</b><div class="mut">'+esc(r.email)+"</div>"],["Phone",r=>esc(r.phone||"–")],["Applied / joined",r=>ds(r.created_at)],["Status",r=>pill(r.kyc_status)],["",r=>'<button class="btn sm" data-a="kyc" data-id="'+r.id+'">Review</button>']],rows,"No sellers in this list.");
};

V.users=async()=>{
  const q=FILT.uq||"";const rows=await rpc("admin_users",{p_q:q});
  $("#view").innerHTML='<div class="hd"><div><h1>Users</h1><p class="m">'+num(rows.length)+' shown</p></div></div><div class="tools"><input id="uq" type="search" placeholder="Search name, email or phone" value="'+esc(q)+'"><button class="btn line" data-a="usearch">Search</button></div>'+
  table([["User",r=>"<b>"+esc(r.full_name||"–")+(r.is_admin?' <span class="pill">admin</span>':"")+'</b><div class="mut">'+esc(r.email)+"</div>"],["Phone",r=>esc(r.phone||"–")],["Role",r=>esc(r.role)],["Seller status",r=>pill(r.kyc_status)],["Listings",r=>num(r.listings)],["Bought",r=>num(r.bought)],["Sold",r=>num(r.sold)],["Joined",r=>ds(r.created_at)],["Last seen",r=>r.last_seen?dt(r.last_seen):"–"]],rows,"No users found.");
  $("#uq").onkeydown=e=>{if(e.key==="Enter"){FILT.uq=e.target.value;V.users().catch(fail)}};
};

V.listings=async()=>{
  const f=FILT.lst||"pending",q=FILT.lq||"";
  const rows=await rpc("admin_listings",{p_status:f==="all"?null:f,p_q:q});
  $("#view").innerHTML='<div class="hd"><div><h1>Listings</h1><p class="m">Approve new accounts before they appear on the site.</p></div></div><div class="tools">'+
  ["pending","live","sold","rejected","all"].map(x=>'<button class="chip'+(f===x?" on":"")+'" data-a="lstf" data-id="'+x+'">'+(x==="all"?"All":LB[x])+"</button>").join("")+
  '<input id="lq" type="search" placeholder="Search title or seller" value="'+esc(q)+'"></div>'+
  table([["Account",r=>"<b>"+esc(r.title)+'</b><div class="mut">'+esc(r.platform)+" · "+esc(r.niche)+"</div>"],["Seller",r=>esc(r.seller_name||"–")+'<div class="mut">'+esc(r.seller_email||"")+"</div>"],["Followers",r=>short(r.followers)],["Price",r=>money(r.price)],["Views",r=>num(r.views)],["Status",r=>pill(r.status)],["Added",r=>ds(r.created_at)],["",r=>'<button class="btn sm" data-a="lst" data-id="'+r.id+'">Open</button>']],rows,"No listings in this list.");
  $("#lq").onkeydown=e=>{if(e.key==="Enter"){FILT.lq=e.target.value;V.listings().catch(fail)}};
  window.LROWS=rows;
};

V.orders=async()=>{
  const f=FILT.ord||"attention";
  const rows=await rpc("admin_orders",{p_filter:f});window.OROWS=rows;
  const T={attention:"Needs attention",ready:"Ready to release",active:"Active",all:"All orders"};
  $("#view").innerHTML='<div class="hd"><div><h1>Orders &amp; payouts</h1><p class="m">Release seller payouts after the 24 hour hold, handle problems and refunds.</p></div></div><div class="tools">'+
  Object.keys(T).map(x=>'<button class="chip'+(f===x?" on":"")+'" data-a="ordf" data-id="'+x+'">'+T[x]+"</button>").join("")+"</div>"+
  table([["Order",r=>"<b>"+r.label+"</b>"],["Account",r=>esc(r.platform)+" · "+esc(r.listing_title)],["Buyer → Seller",r=>esc(r.buyer_name)+" → "+esc(r.seller_name)],["Amount",r=>money(r.amount)],["Status",r=>pill(r.status)+(r.disputed?' <span class="pill bad">problem</span>':"")+(r.needs_refund?' <span class="pill bad">refund</span>':"")],["Payout",r=>pill(r.payout_status==="none"?"":r.payout_status)||"–"],["Date",r=>ds(r.created_at)],["",r=>'<button class="btn sm" data-a="ord" data-id="'+r.id+'">Open</button>']],rows,"No orders in this list.");
};

V.searches=async()=>{
  const rows=await rpc("top_searches");
  $("#view").innerHTML='<div class="hd"><div><h1>What people search for</h1><p class="m">Top searches in the last 7 days. Useful to know which accounts to ask sellers for.</p></div></div>'+
  table([["Search word",r=>"<b>"+esc(r.term)+"</b>"],["Searches",r=>num(r.hits)]],rows,"No searches yet.");
};

/* ---------- clicks ---------- */
const IMG=/^[0-9a-f-]{36}\/.+\.(jpe?g|png|webp|heic|gif)$/i;
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  try{
    if(a==="kycf"){FILT.kyc=id;return V.sellers()}
    if(a==="lstf"){FILT.lst=id;return V.listings()}
    if(a==="ordf"){FILT.ord=id;return V.orders()}
    if(a==="usearch"){FILT.uq=$("#uq").value;return V.users()}
    if(a==="kyc")return openKyc(id);
    if(a==="lst")return openListing(id);
    if(a==="ord")return openOrder(id);
    b.disabled=true;
    if(a==="kyc-set"){const st=b.dataset.s;let note="";if(st==="rejected"){note=prompt("Reason for the seller (they will see this):","");if(note===null){b.disabled=false;return}}
      await rpc("admin_set_kyc",{p_user:id,p_status:st,p_note:note});toast(st==="verified"?"Seller approved":"Seller rejected");closeM();V.sellers();refreshBadges()}
    if(a==="lst-set"){const st=b.dataset.s;let note="";if(st==="rejected"){note=prompt("Reason for the seller (optional):","")||""}
      await rpc("admin_set_listing",{p_id:id,p_status:st,p_note:note});toast(st==="live"?"Listing is live":"Listing updated");closeM();V.listings();refreshBadges()}
    if(a==="release"){if(!confirm("Have you paid the seller? This marks the order completed."))return b.disabled=false;
      await rpc("admin_release_order",{p_order:id});toast("Payout released");closeM();V.orders();refreshBadges()}
    if(a==="refund"){const n=prompt("Note for the refund (reason):","");if(n===null)return b.disabled=false;
      if(!confirm("Send the refund from your payment gateway first. Mark this order as refunded?"))return b.disabled=false;
      await rpc("admin_refund_order",{p_order:id,p_note:n});toast("Order refunded");closeM();V.orders();refreshBadges()}
    if(a==="dismiss"){if(!confirm("Close the buyer's reported problem? The payout can then be released."))return b.disabled=false;
      await rpc("admin_dismiss_dispute",{p_order:id});toast("Problem closed");closeM();V.orders();refreshBadges()}
  }catch(err){fail(err);b.disabled=false}
});

async function openKyc(id){
  const [u,d]=await Promise.all([rpc("admin_users",{p_q:null}).then(a=>a.find(x=>x.id===id)||{}),rpc("admin_kyc_detail",{p_user:id})]);
  const skip=/^(user_id|id|front_path|back_path)$/;const imgs=[],rows=[];
  for(const k of Object.keys(d)){const v=d[k];if(typeof v==="string"&&IMG.test(v))imgs.push([k,v]);else if(!skip.test(k)&&v!==null&&typeof v!=="object")rows.push([esc(k.replace(/_/g," ")),esc(/_at$/.test(k)?dt(v):v)])}
  for(const k of ["front_path","back_path"])if(IMG.test(d[k]||"")&&!imgs.some(i=>i[1]===d[k]))imgs.push([k,d[k]]);
  const signed=await Promise.all(imgs.map(async i=>{const r=await sb.storage.from("kyc").createSignedUrl(i[1],600);return [i[0],r.data&&r.data.signedUrl]}));
  modal('<h2>'+esc(u.full_name||"Seller")+" "+pill(u.kyc_status)+"</h2>"+kv([["Email",esc(u.email)],["Phone",esc(u.phone)],["Joined",dt(u.created_at)]])+
   (rows.length?"<h3>Application</h3>"+kv(rows):'<p class="mut">No application details found in the database.</p>')+
   (signed.length?"<h3>ID and photos</h3><div class=\"imgs\">"+signed.map(s=>s[1]?'<a href="'+s[1]+'" target="_blank" rel="noopener"><img src="'+s[1]+'" alt=""><span>'+esc(s[0].replace(/_/g," "))+"</span></a>":"").join("")+"</div>":"")+
   '<div class="acts" style="margin-top:18px"><button class="btn ok" data-a="kyc-set" data-s="verified" data-id="'+id+'">Approve seller</button><button class="btn bad" data-a="kyc-set" data-s="rejected" data-id="'+id+'">Reject</button></div>');
}
function openListing(id){
  const l=(window.LROWS||[]).find(x=>x.id===id);if(!l)return;
  modal("<h2>"+esc(l.title)+" "+pill(l.status)+"</h2>"+kv([["Platform",esc(l.platform)+" · "+esc(l.niche)],["Seller",esc(l.seller_name)+" ("+esc(l.seller_email)+") "+pill(l.seller_kyc)],["Followers",num(l.followers)],["Income / month",money(l.income)],["Price",money(l.price)],["Audience",esc(l.audience)],["Views",num(l.views)],["Account link",'<a href="'+esc(l.account_link)+'" target="_blank" rel="noopener">'+esc(l.account_link)+"</a>"],["Description",esc(l.description)],["Added",dt(l.created_at)]])+
  ((l.shots||[]).length?'<div class="imgs">'+l.shots.map(s=>'<a href="'+esc(s)+'" target="_blank" rel="noopener"><img src="'+esc(s)+'" alt=""></a>').join("")+"</div>":"")+
  '<div class="acts" style="margin-top:18px">'+(l.status!=="live"&&l.status!=="sold"?'<button class="btn ok" data-a="lst-set" data-s="live" data-id="'+id+'">Approve – make live</button>':"")+(l.status!=="rejected"&&l.status!=="sold"?'<button class="btn bad" data-a="lst-set" data-s="rejected" data-id="'+id+'">Reject</button>':"")+(l.status==="live"?'<button class="btn line" data-a="lst-set" data-s="pending" data-id="'+id+'">Take offline</button>':"")+"</div>");
}
async function openOrder(id){
  const o=(window.OROWS||[]).find(x=>x.id===id);if(!o)return;const ev=await rpc("admin_order_events",{p_order:id});
  const ready=o.payout_status==="held"&&!o.disputed&&o.release_at&&new Date(o.release_at)<=new Date();
  modal("<h2>"+o.label+" "+pill(o.status)+"</h2>"+kv([["Account",esc(o.platform)+" · "+esc(o.listing_title)],["Buyer",esc(o.buyer_name)],["Seller",esc(o.seller_name)],["Amount",money(o.amount)],["Your fee",money(o.fee)],["Pay seller",money(o.amount-o.fee)],["Payment",pill(o.payment_status)+(o.gateway?' <span class="mut">'+esc(o.gateway)+" "+esc(o.gateway_ref)+"</span>":"")],["Payout",pill(o.payout_status==="none"?"":o.payout_status)],["Release after",o.release_at?dt(o.release_at)+(ready?" (ready)":""):"–"],["Created",dt(o.created_at)]])+
  (o.disputed?'<div class="note"><b>Buyer reported a problem</b><br>'+esc(o.dispute_note||"No details given.")+"</div>":"")+(o.needs_refund?'<div class="note"><b>Needs refund / review</b><br>'+esc(o.payout_note||"")+"</div>":"")+
  "<h3>History</h3><div class=\"tl\">"+(ev.map(x=>"<div><b>"+esc(x.kind)+"</b> · "+esc(x.note||"")+' <span class="mut">'+dt(x.created_at)+"</span></div>").join("")||'<span class="mut">No events.</span>')+"</div>"+
  '<div class="acts" style="margin-top:14px">'+(ready?'<button class="btn ok" data-a="release" data-id="'+id+'">Release payout to seller</button>':"")+(o.disputed?'<button class="btn line" data-a="dismiss" data-id="'+id+'">Close problem (seller is right)</button>':"")+(o.payment_status==="paid"?'<button class="btn bad" data-a="refund" data-id="'+id+'">Refund buyer</button>':"")+"</div>");
}

start();
</script>
</body></html>
